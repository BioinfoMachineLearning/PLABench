name: plabench-llf
channels:
  - conda-forge
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=4.5
  - ca-certificates=2025.8.3
  - ld_impl_linux-64=2.44
  - libffi=3.4.6
  - libgcc=15.1.0
  - libgcc-ng=15.1.0
  - libgomp=15.1.0
  - liblzma=5.8.1
  - liblzma-devel=5.8.1
  - libnsl=2.0.1
  - libsqlite=3.50.4
  - libstdcxx=15.1.0
  - libstdcxx-ng=15.1.0
  - libzlib=1.3.1
  - ncurses=6.5
  - openssl=3.5.3
  - pip=24.0
  - python=3.7.12
  - readline=8.2
  - setuptools=69.0.3
  - sqlite=3.50.4
  - tk=8.6.13
  - wheel=0.42.0
  - xz=5.8.1
  - xz-gpl-tools=5.8.1
  - xz-tools=5.8.1
  - pip:
      # torch-scatter and torch-sparse are built per torch/CUDA pair and live on
      # the PyG wheel index, not on PyPI. `conda env export` keeps the local
      # version label it sees (+pt113cu117) but cannot record where the wheel
      # came from, so without these two lines pip cannot resolve them.
      - --find-links https://data.pyg.org/whl/torch-1.13.1+cu117.html
      - --find-links https://data.pyg.org/whl/torch-1.13.1+cpu.html
      - astor==0.8.1

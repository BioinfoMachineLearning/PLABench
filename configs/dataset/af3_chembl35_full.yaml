# AF3 structure-based prediction on full ChEMBL35 (84 targets, 7660 pairs)
# Used by: bapred, flowdock
name: af3_chembl35_full
path: data/AF3_structures/chembl35_full
mode: stage1
target_pattern: "*"
ground_truth_path: data/chembl35/chembl35_full_input.csv
boltz2_mode: true
prot_pattern: "{pdb_id}/protein.pdb"
lig_pattern: "{pdb_id}/ligand.sdf"
multi_protein: true  # skip pooled; split by compound_id prefix (UniProt_ID)

# Sequence-based LLF inference on ChEMBL35 full set, using the stage1 model
# (BindingMOAD + BindingNet, large-scale pretrain ckpt user trained at
# /bmlfast/Lyuwei/0.Projects/LLF/models/stage1/best_model_full.pth).
# Note: this ckpt was trained BEFORE the 2026-05-03 SMILES standardization fix
# in plabench/data_dump/ligand_utils.py — the training data had ionized /
# explicit-H SMILES.  Run is for diagnostic comparison vs v1 / v2 / v3.
name: sequence_chembl35_full_stage1
path: data/chembl35/chembl35_full_input.csv
mode: inference
ground_truth_path: data/chembl35/chembl35_full_input.csv
ground_truth_format: csv
multi_protein: true  # split by compound_id prefix (UniProt_ID); skip pooled

# stage1 ckpt + max_seq_len overrides (consumed by llf_wrapper.py).
task: stage1
model_path: forks/LLF/models/stage1/best_model_full.pth
max_seq_len: 1500
